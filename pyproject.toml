[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsync-local"
version = "0.3.0a55"
description = "Amadeus: local, model-independent multi-agent task coordination over MCP, HTTP and Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Amadeus contributors"}]
dependencies = [
  "mcp==2.3.0",
  "fastapi==0.147.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "build==1.6.1",
  "pip-licenses==5.5.5",
]

[project.scripts]
amadeus = "agentsync.cli:amadeus_main"
agentsync = "agentsync.cli:main"

[project.urls]
Repository = "https://github.com/JayChan697891/Amadeus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentsync = ["py.typed", "storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
# Raw historical proof members keep their original bytes for checksum verification.
extend-exclude = [
  "docs/acceptance/evidence/cancellation-readable",
  "docs/acceptance/evidence/full-linux-readable",
  "docs/acceptance/evidence/alpha29-readable",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/agentsync"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
