name: quality
# Storage-only GitHub policy: never run automatically on uploads or PR updates.
on: workflow_dispatch
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - name: Collect isolated regression and package-install evidence
        run: python tools/release_acceptance.py --output "${{ runner.temp }}/agentsync-evidence" --run --package-install --sdist-install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/agentsync-evidence/*/report.json
            ${{ runner.temp }}/agentsync-evidence/*/Release-Acceptance-Report.md
            ${{ runner.temp }}/agentsync-evidence/*/requirements.json
            ${{ runner.temp }}/agentsync-evidence/*/source-snapshot.json
            ${{ runner.temp }}/agentsync-evidence/*/working-tree.patch
            ${{ runner.temp }}/agentsync-evidence/*/junit.xml
            ${{ runner.temp }}/agentsync-evidence/*/wheel-junit.xml
            ${{ runner.temp }}/agentsync-evidence/*/sdist-junit.xml
            ${{ runner.temp }}/agentsync-evidence/*/logs/*
            ${{ runner.temp }}/agentsync-evidence/*/artifacts/*
